name: ci

on:
  push:
  pull_request:
    branches: [main]
  # Manual trigger — the escape hatch for the 2026-07-19 gap where GitHub
  # delivered no push event for two consecutive main merges (#617/#618),
  # leaving them with zero CI runs (watchdog Check S would page on it the
  # next morning). `gh workflow run ci --ref main` re-covers main HEAD.
  workflow_dispatch:

# Cancel superseded in-flight runs for the same ref (overlapping pushes to a
# branch). main-branch CI on merge commits is unaffected — distinct refs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy, blocking)
        run: mypy .

      # §58 verification scope parity (audit 2026-08-16 H-1). Coverage previously
      # measured ONLY shared/ + safety_reports/ — leaving ~70K LOC across seven
      # production packages with no coverage signal at all, including the PIN-gated
      # operator_dashboard ACT surface and the po_materials hostile-PDF sandbox.
      # `--cov-fail-under` makes the number a DEFENDED FLOOR rather than a reported
      # statistic: it ratchets upward only. Lowering it requires a docs/tech_debt.md
      # entry naming what regressed and why.
      # The floor is READ FROM .quality-ratchet.json, never duplicated here. That file
      # is the single location for every numeric quality floor in the repo; a second
      # copy in this workflow is a copy that drifts, and the drifted one always wins
      # silently. `scripts/check_quality_ratchet.py` below enforces the same number
      # against the same file, so the two cannot disagree.
      #
      # `--cov-report=json` is what the ratchet step reads back — it must not be
      # dropped, or the coverage metric goes UNMEASURED and the ratchet fails closed.
      - name: Tests (pytest + coverage, all production packages)
        run: |
          FLOOR=$(python -c "import json;print(json.load(open('.quality-ratchet.json'))['coverage_percent']['floor'])")
          echo "coverage floor from .quality-ratchet.json: $FLOOR"
          pytest -q --cov-report=term-missing --cov-report=json:coverage.json \
            --cov=shared --cov=safety_reports --cov=field_ops \
            --cov=progress_reports --cov=po_materials --cov=subcontracts \
            --cov=docs_pdf --cov=operator_dashboard \
            --cov-fail-under="$FLOOR"

      # §60 supply-chain visibility (audit 2026-08-16 H-2). The repo runs a
      # full-history secret scan and a hostile-PDF sandbox but had ZERO visibility
      # into its own dependency CVEs.
      #
      # `--skip-editable` is REQUIRED, not cosmetic: CI installs this repo with
      # `pip install -e ".[dev]"`, and pip-audit cannot resolve the local `its`
      # distribution on PyPI. Under `--strict` that is a hard ERROR — the audit
      # aborts before scanning anything and exits 1, which a trailing `|| true`
      # then swallows, leaving a step that looks green and scanned nothing.
      # Verified 2026-08-17: `--strict --desc` exits 1 reporting zero findings;
      # `--desc --skip-editable` exits 0 having audited the full resolved set.
      #
      # NON-BLOCKING by design. The blocking supply-chain tier is the portal job's
      # `npm audit --omit=dev --audit-level=high` (production runtime). pip-audit
      # has no prod/dev split for an installed environment and this repo's dev
      # extras pull the whole test toolchain, so gating here would red-line main on
      # a build-only advisory — the alarm-fatigue failure §57 names. Findings surface
      # as a CI annotation and are triaged in docs/tech_debt.md.
      - name: Dependency CVE scan (pip-audit — informational)
        run: |
          pip-audit --desc --skip-editable \
            || echo "::warning::pip-audit findings — triage in docs/tech_debt.md (blocking tier is the portal npm audit)."

      # Warn-only during the retrofit window (see docs/operations/doc_conventions.md
      # "Retrofit policy"). Both invocations are designed to exit 0 even with
      # violations; output appears in the CI log so the operator can see drift.
      - name: Doc-conventions lint (warn-only)
        run: python -m scripts.lint_doc_conventions

      - name: Doc-index freshness (warn-only)
        run: python -m scripts.regen_doc_indexes --check || echo "::warning::Doc indexes stale — run \`python -m scripts.regen_doc_indexes\` locally."

      # BLOCKING on the precise mechanical drift checks only. check_doctrine_drift
      # is the propose-only MECHANICAL tier of the cross-repo drift guard; in
      # --strict mode it exits 1 if any BLOCKING finding exists — M1 (doctrine
      # version cited stale in current-doctrine prose, the ops-stds-enforcer-staleness
      # class), M4 (canonical sheet-id drift), or M7 (an `Op Stds §N` citation that
      # resolves to no section). These three are false-positive-free by construction.
      # The FP-prone M2 (tech_debt self-closure heuristic) and the M3/M5/M6 coverage
      # tiers still PRINT (the operator + the semantic doc-reconciliation-auditor agent
      # decide) but do NOT gate. The default (no --strict) invocation stays exit-0
      # propose-only for the agent + unit tests.
      - name: Doctrine-drift check (blocking — M1/M4/M7 mechanical drift)
        run: python -m scripts.check_doctrine_drift --strict

      # THE SLOPE CONTROL (audit 2026-08-16). Every other gate in this file answers
      # "is it broken right now". This one answers "is it getting worse", which is
      # the question the audit found nothing was asking: six controls had each been
      # individually, reasonably relaxed, and the aggregate was a safety story that
      # was narrated rather than enforced.
      #
      # BLOCKING. The baseline ref must be fetched first and the fetch must NOT be
      # `|| true` — if origin/main is unresolvable the checker fails, because
      # silently skipping the wrong-way-move comparison turns the whole relaxation
      # rule into advice. `actions/checkout` leaves a shallow clone with no
      # origin/main, hence the explicit refspec.
      #
      # No `--skip` and no `--today` here, deliberately: `--skip` would leave a
      # metric unmeasured, and `--today` would let an expired relaxation pass.
      # tests/test_quality_ratchet.py asserts this step passes neither.
      - name: Fetch ratchet baseline
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - name: Quality ratchet (blocking — floors, ceilings, expiring relaxations)
        run: |
          python scripts/check_quality_ratchet.py \
            --coverage-json coverage.json \
            --baseline-ref origin/main

  # Safety Portal (Cloudflare Worker + React SPA) — TypeScript typecheck + Worker
  # tests. BLOCKING, like `test`. The Python `test` job does NOT cover safety_portal/
  # TS at all, so without this job the auth/role/impersonation code in the Worker
  # would merge with zero automated coverage. Worker tests run in workerd via
  # @cloudflare/vitest-pool-workers against a real Miniflare D1 (not mocks).
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safety_portal
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        # v6 is the current stable line (latest v6.4.0) and matches the repo's
        # actions/checkout@v6 + setup-python@v6 pins. §41 review: v6's only breaking
        # change vs v4 is that automatic caching is limited to npm — which is exactly
        # this job's explicit `cache: npm`, so it is a no-op for us. (v5 bumped the
        # action runtime to node24; GitHub-hosted ubuntu runners are well past the
        # required runner version.)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: safety_portal/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      # §60 supply-chain visibility (audit 2026-08-16 H-2). BLOCKING on PRODUCTION
      # runtime deps only (`--omit=dev`): a CVE in hono/react/bcryptjs serves real
      # traffic. The full tree (wrangler/miniflare/vitest/sharp toolchain) is scanned
      # non-blocking so the backlog is visible without red-lining main on a
      # build-only advisory.
      - name: Dependency CVE scan — production runtime (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency CVE scan — full tree (informational)
        run: npm audit || echo "::warning::npm audit findings in the dev/build toolchain — see log."

      - name: Typecheck (tsc — SPA + Worker)
        run: npm run typecheck

      - name: Worker tests (vitest-pool-workers — real workerd + D1)
        run: npm test

      - name: SPA render-smoke (vitest + jsdom — third renderer, brief C5)
        # Renders every ACTIVE catalog form through the SPA <FormRenderer/> and asserts
        # NON-DEGRADED DOM — the third leg of the render-smoke net (the two Python
        # renderers are covered by tests/test_render_smoke.py in the `test` job). Runs
        # in jsdom (a separate vitest config from the workerd worker pool above).
        run: npm run test:spa

  # Secret-scanning gate. BLOCKING (unlike the propose-only doc/drift steps) —
  # a committed secret must stop the merge. Separate job so it runs in parallel
  # with `test` and surfaces as its own PR check. Uses the pinned gitleaks
  # BINARY rather than gitleaks/gitleaks-action@v2 because that action requires
  # a paid GITLEAKS_LICENSE for org-owned repos; the pinned binary avoids the
  # dependency regardless of who owns the repo. Pin GITLEAKS_VERSION on bumps
  # after reading the release notes.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full commit history for the `gitleaks git` scan

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history for secrets (blocking)
        run: gitleaks git . --redact --no-banner --exit-code 1

      - name: Guard against production-identity re-entry in code (working tree, blocking)
        # Filesystem scan of the CURRENT tree (not history — the production domain is
        # immutable in past commits). Flags any @evergreenrenewables.com email that
        # re-enters .py/.ts/.tsx; tests+seeds must use @example.com / mirror addresses.
        run: gitleaks dir . --config .gitleaks-identity.toml --no-banner --exit-code 1
