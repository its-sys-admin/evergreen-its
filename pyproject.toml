[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "its"
version = "0.1.0"
description = "ITS — Integrated Technical System execution layer for Evergreen Renewables."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    # Upper-bounded <3.10: a smartsheet-python-sdk release >3.9.0 (2026-06-08)
    # dropped/moved `smartsheet.exceptions`, which shared/smartsheet_client.py
    # imports — an unpinned `>=3.0.0` let CI pull it and broke all 48 test modules
    # at collection. 3.9.0 (last-green) is pin-compatible. Loosen once a newer SDK
    # is verified against shared/smartsheet_client.py. See docs/tech_debt.md.
    "smartsheet-python-sdk>=3.0.0,<3.10.0",
    # Pinned to legacy 3.x because the OAuth client (shared/box_client.py)
    # uses the `boxsdk.OAuth2` + `boxsdk.Client` API. The PyPI `boxsdk`
    # package jumped to a renamed Gen API at 10.x (imports as
    # `box_sdk_gen`, different surface). Migration to the Gen API is a
    # separate decision; legacy 3.x is supported and stable.
    "boxsdk>=3.10.0,<4.0.0",
    "msal>=1.28.0",
    "requests>=2.34.2",
    "python-docx>=1.1.0",
    # Renders the editable Annex C Schedule-of-Values workbook (subcontracts SC-S3b): the
    # operator wanted the SOV as an editable .xlsx (not a flat PDF) so line values can be
    # adjusted by hand. openpyxl writes .xlsx with no native toolchain. Output is made
    # byte-deterministic by subcontract_docx._normalize_ooxml_clock (openpyxl's own save
    # stamps zip members from wall-clock). §41: latest upstream 3.1.5 (2026); no breaking
    # changes 3.1.0→3.1.5 (minor/patch lineage) — floor pin, matching this file's convention.
    "openpyxl>=3.1.0",
    "python-dateutil>=2.9.0",
    "holidays>=0.50",
    "sentry-sdk>=2.0,<3.0",
    # Required by scripts/regen_doc_indexes.py + scripts/lint_doc_conventions.py
    # to parse YAML frontmatter in markdown docs. Transitively pulled in
    # locally by other deps but not guaranteed; pin explicitly for CI.
    "pyyaml>=6.0",
    # Validates safety_portal/forms/*.json against forms/meta-schema.json — the
    # single source of truth both renderers (TS display + Python PDF) consume.
    # Floor raised to 4.21 for the vendor-estimate lane (ADR-0004 E5):
    # shared/ollama_client.py validates every schema-constrained local-LLM reply
    # against schemas/vendor_estimate_extraction.json before returning it.
    "jsonschema>=4.21",
    # Deterministic render-parity PDF renderer for Safety Portal submissions
    # (safety_reports/form_pdf.py, Option B — intake renders on arrival, Phase 5).
    # No AI; embeds SVG-path signatures + the definition's mandatory/legal text.
    "reportlab>=4.0",
    # Merges the per-submission PDFs into the Sat→Fri weekly packet
    # (safety_reports/form_pdf.merge_pdfs, consumed by weekly_generate in Phase 5);
    # also extracts text in tests/test_form_pdf.py for render-parity assertions.
    "pypdf>=4.0",
    # §34 photo screening (safety_reports/photo_screen.py, PR-2): structural verify +
    # decompression-bomb cap + forced re-encode to a clean JPEG (destroys appended/
    # polyglot payloads, strips EXIF), and the in-PDF photo embed (form_pdf). The
    # optional ClamAV layer (pyclamd) is operator-installed + config-gated, not pinned.
    # §41 version-bump: latest upstream is 12.2.0 (2026-06); 11.x/12.x release notes
    # reviewed — the open→verify→convert('RGB')→thumbnail→frombytes→save path used here is
    # stable across 10–12 (the removed Image.ANTIALIAS/LINEAR constants are not used).
    # Upper-bounded <13 so a future major can't silently introduce a breaking change.
    "Pillow>=10.0,<13.0",
    # Pure-Python CommonMark parser (WS3 docs pipeline, docs_pdf/md_render.py). We
    # consume its flat TOKEN STREAM (not the HTML render) and translate tokens →
    # reportlab Platypus flowables to produce branded PDF manuals from the in-repo
    # markdown enablement guides. DELIBERATELY the only new dep for the pipeline — no
    # weasyprint / pandoc / LaTeX (all carry heavyweight/native toolchains); reportlab
    # is already pinned for the safety-PDF renderer. The GFM table rule is enabled
    # explicitly (`.enable("table")`); linkify-it-py is NOT required (we never linkify).
    "markdown-it-py>=3.0,<4.0",
    # WS2 operator dashboard (operator_dashboard/, D1-1): a loginless,
    # localhost-only read-only observability app over the live daemon tree.
    # FastAPI + uvicorn serve it; Jinja2 renders the panels (autoescape is the
    # load-bearing XSS defense over untrusted Smartsheet/log content). htmx is
    # VENDORED (operator_dashboard/static/htmx.min.js, no CDN), so it is not a
    # Python dependency.
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    # WS2 D1-2 ACT surface: FastAPI form parsing for the PIN-gated config-edit
    # POST (operator_dashboard/act/router.py uses fastapi.Form).
    "python-multipart>=0.0.9",
    # Vendor-estimate importer (ADR-0004 E2, po_materials/estimate_classify.py):
    # deterministic per-page text extraction for the doc-type gate. Imported ONLY
    # inside the killable rlimited estimate_sandbox child (red-team #5) — the
    # daemon process never loads it, so a parser wedge/OOM on a hostile PDF dies
    # in the child. Floor pin per this file's convention.
    "pdfplumber>=0.11",
    # Quartz (CoreGraphics/ImageIO) bridge for the disposition-screen page-preview
    # render (po_materials/estimate_preview.py via estimate_sandbox). macOS-only by
    # design (the execution host is a MacBook — same posture as shared/keychain.py);
    # imported lazily inside the sandbox child, and a missing/failed import degrades
    # to zero previews rather than erroring (ADR-0004 decision 3 no-preview path).
    # §41 version-bump: latest upstream is 12.2.1 (checked 2026-07-19); the CG* /
    # CGImageDestination* call surface used here is stable across 10.x–12.x.
    # Upper-bounded <13.0 so a future pyobjc major can't silently break the bridge
    # (the Pillow/openpyxl risk-bearing-dep convention in this file).
    "pyobjc-framework-Quartz>=10.0,<13.0; sys_platform == 'darwin'",  # macOS-only: setup shells to sw_vers — env-marked so Linux CI installs (runtime is Darwin; estimate_preview degrades to [] without it)
    # macOS Vision OCR for SCANNED vendor estimates (ADR-0004 E5,
    # po_materials/estimate_ocr.py): ocrmac wraps VNRecognizeTextRequest
    # ('accurate'); pyobjc-framework-Vision is its Vision bridge. macOS-only by
    # design (same posture as the Quartz pin above); imported LAZILY inside
    # ocr_pages, and a missing/broken import degrades to [] (no text recovered →
    # Tier-3 review), never an error. Floor pins per this file's convention.
    "ocrmac>=1.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.0,<13.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    # §59 toolchain pin parity: the gates that DEFINE the quality bar are bounded to
    # the same standard as runtime deps (§41). A ruff/mypy major can change what the
    # blocking gate enforces with no commit — two CI runs months apart must check the
    # same things. Bump deliberately after reading release notes. Audit 2026-08-16 H-4.
    "ruff>=0.5.0,<0.17.0",
    "mypy>=1.10,<3.0",
    "types-requests>=2.32",
    "types-jsonschema>=4.0",
    # Starlette's TestClient (used by tests/test_operator_dashboard.py) is
    # httpx-backed; needed only for the test suite, not at runtime.
    "httpx>=0.27",
    # §60 supply-chain visibility: dependency CVE scan, run in CI. Audit 2026-08-16 H-2.
    "pip-audit>=2.7",
    # Cyclomatic complexity for scripts/check_code_quality_metrics.py (the M-5/M-7
    # anti-slop metrics feeding .quality-ratchet.json). Upper-bounded per §59: radon's
    # block model is what the erosion metric is built on — a major that changes how
    # classes/closures are reported would move every number without a commit.
    "radon>=6.0,<7.0",
]

[tool.setuptools]
# Python packages that ship with the project.
# Asset directories (schemas, prompts, scripts, logs) are NOT Python packages.
packages = ["shared", "safety_reports", "field_ops", "progress_reports", "po_materials", "subcontracts", "docs_pdf", "operator_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"smartsheet_migration/*" = ["E401", "I001", "F401", "B007", "UP035"]
"box_migration/*"        = ["I001", "F401", "UP042", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default invocation skips integration tests — those hit live Smartsheet
# and require ITS_SMARTSHEET_TOKEN in Keychain. Operator runs them
# explicitly with `pytest -m integration` pre-deployment / after any
# smartsheet_client.py change. CI doesn't have live credentials, so
# default-skip keeps CI green.
# §58 verification scope parity (audit 2026-08-16 H-1) is enforced in CI, NOT
# here: .github/workflows/ci.yml passes the eight `--cov=<pkg>` flags plus
# `--cov-fail-under=${COVERAGE_FLOOR}`, and that floor ratchets UPWARD only.
# Deliberately absent from `addopts` — otherwise a bare local
# `pytest tests/test_one_thing.py` would instrument the whole tree and fail the
# floor on a single-file run. ci.yml is the live scope + floor of record.
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: live-API tests against Smartsheet sandbox. Skipped by default; run with `pytest -m integration`. Requires ITS_SMARTSHEET_TOKEN in Keychain. NOT executed in CI.",
    "flaky: pytest-rerunfailures marker — auto-reruns a transiently-failing test (registered here for --strict-markers). Used by the Smartsheet integration suite to absorb create→read/write eventual-consistency 404/1006 flapping.",
]

# ---- mypy ---------------------------------------------------------------
# `scratchpad/` is gitignored throwaway (see .gitignore) and exists ONLY on a
# developer machine — CI never checks it out. Without this exclude, `mypy .`
# reports whatever half-finished scripts happen to be sitting there, so the same
# commit types clean in CI and dirty locally. That divergence became consequential
# when scripts/check_quality_ratchet.py started reading the mypy error COUNT as a
# ratchet metric: two stale 2026-07 scratch files made the local run FAIL a bound
# that CI held at 0. Excluding it makes `mypy .` mean the same thing in both places.
#
# Deliberately NOT setting check_untyped_defs here — that is audit finding M-1 and a
# separate ~1-day burn-down (3,487 unchecked test bodies). This section exists only
# to scope the walk.
[tool.mypy]
exclude = ["^scratchpad/"]


# Vendor SDKs without published type stubs or py.typed markers — silenced
# at the module boundary so mypy stays at zero baseline. types-requests
# (the proper fix for `requests`) is in dev deps above; the others have
# no maintained stubs upstream as of 2026-05.
[[tool.mypy.overrides]]
module = ["msal", "msal.*", "smartsheet", "smartsheet.*", "boxsdk", "boxsdk.*", "reportlab", "reportlab.*",
          "PIL", "PIL.*", "pyclamd", "pyclamd.*", "docx", "docx.*", "openpyxl", "openpyxl.*",
          "pdfplumber", "pdfplumber.*", "Quartz", "Quartz.*", "ocrmac", "ocrmac.*",
          "Vision", "Vision.*", "radon", "radon.*"]
ignore_missing_imports = true
